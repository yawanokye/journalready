services:
  - type: web
    name: journalready
    runtime: python
    plan: starter
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    disk:
      name: articleready-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: OPENAI_API_KEY
        sync: false
      - key: ARTICLEREADY_ALLOWED_MODEL_FAMILIES
        value: gpt-5.4,gpt-5.5,gpt-5.6
      - key: ARTICLEREADY_ALLOW_UNAPPROVED_MODELS
        value: "0"
      - key: OPENAI_ARTICLE_WRITING_MODEL
        value: gpt-5.5
      - key: OPENAI_ARTICLE_CONCEPTUAL_MODEL
        value: gpt-5.5
      - key: OPENAI_ARTICLE_REVISION_MODEL
        value: gpt-5.5
      - key: OPENAI_ARTICLE_HUMANIZER_MODEL
        value: gpt-5.4
      - key: OPENAI_ARTICLE_ANALYSIS_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_ARTICLE_AUDIT_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_ARTICLE_REVISION_RECOVERY_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_ARTICLE_FAST_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_ARTICLE_REVISION_PLAN_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_ARTICLE_ESCALATION_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_ARTICLE_FALLBACK_MODELS
        value: gpt-5.6-terra,gpt-5.6-sol
      - key: OPENAI_ARTICLE_WRITING_REASONING
        value: high
      - key: OPENAI_ARTICLE_CONCEPTUAL_REASONING
        value: high
      - key: OPENAI_ARTICLE_REVISION_REASONING
        value: high
      - key: OPENAI_ARTICLE_REVISION_RECOVERY_REASONING
        value: high
      - key: OPENAI_ARTICLE_HUMANIZER_REASONING
        value: medium
      - key: OPENAI_ARTICLE_ANALYSIS_REASONING
        value: xhigh
      - key: OPENAI_ARTICLE_ANALYSIS_RECOVERY_REASONING
        value: high
      - key: OPENAI_ARTICLE_REVISION_REPORT_REASONING
        value: high
      - key: OPENAI_ARTICLE_FAST_REASONING
        value: high
      - key: OPENAI_ARTICLE_ESCALATION_REASONING
        value: high
      - key: OPENAI_ARTICLEREADY_TIMEOUT_SECONDS
        value: "600"
      - key: ARTICLEREADY_REVISION_TIMEOUT_SECONDS
        value: "600"
      - key: OPENAI_ARTICLEREADY_SDK_RETRIES
        value: "1"
      - key: OPENAI_ARTICLEREADY_ATTEMPTS_PER_MODEL
        value: "1"
      - key: OPENAI_ARTICLEREADY_CHAT_FALLBACK
        value: "0"
      - key: ARTICLEREADY_REVISION_USE_AI
        value: "1"
      - key: ARTICLEREADY_ALLOW_REVISION_FALLBACK
        value: "0"
      - key: ARTICLEREADY_REVISION_BATCH_THRESHOLD_WORDS
        value: "4500"
      - key: ARTICLEREADY_REVISION_SECTION_MAX_WORDS
        value: "1400"
      - key: ARTICLEREADY_REVISION_PACK_MAX_WORDS
        value: "1400"
      - key: ARTICLEREADY_REVISION_PACK_SHORT_SECTIONS
        value: "1"
      - key: ARTICLEREADY_REVISION_RETRY_SPLIT_MAX_DEPTH
        value: "3"
      - key: ARTICLEREADY_REVISION_RETRY_MIN_WORDS
        value: "280"
      - key: ARTICLEREADY_REVISION_MIN_SECTION_LENGTH_RATIO
        value: "0.58"
      - key: ARTICLEREADY_REVISION_MAX_SOURCE_CONTEXT
        value: "60"
      - key: ARTICLEREADY_REVISION_PLAN_ENABLED
        value: "1"
      - key: ARTICLEREADY_REVISION_SECOND_HUMANIZER_MODEL_PASS
        value: "1"
      - key: ARTICLEREADY_REVISION_PLAN_MAX_OUTPUT_TOKENS
        value: "4500"
      - key: ARTICLEREADY_REVISION_SECTION_MAX_OUTPUT_TOKENS
        value: "24000"
      - key: ARTICLEREADY_REVISION_REPORT_MAX_OUTPUT_TOKENS
        value: "7000"
      - key: ARTICLEREADY_REVIEWER_MATRIX_MAX_OUTPUT_TOKENS
        value: "4500"
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: ARTICLEREADY_PAYMENT_REQUIRED
        value: "1"
      - key: APP_BASE_URL
        value: https://articlereadyai.com
      - key: ARTICLEREADY_SQLITE_DB_PATH
        value: /var/data/articleready_payments.db
      - key: ARTICLEREADY_REVIEW_DB_PATH
        value: /var/data/articleready_review_workspace.db
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ARTICLEREADY_DEVELOPER_ACCESS_ENABLED
        value: "0"
      - key: ARTICLEREADY_DEVELOPER_ACCESS_EMAIL
        sync: false
      - key: ARTICLEREADY_DEVELOPER_ACCESS_CODE_SHA256
        sync: false
      - key: ARTICLEREADY_DEVELOPER_ACCESS_SECRET
        generateValue: true
      - key: ARTICLEREADY_DEVELOPER_SESSION_HOURS
        value: "12"
      - key: ARTICLEREADY_ALLOWED_HOSTS
        value: articlereadyai.com,www.articlereadyai.com,*.onrender.com,localhost,127.0.0.1,testserver
      - key: ARTICLEREADY_ALLOWED_ORIGINS
        value: https://articlereadyai.com,https://www.articlereadyai.com
      - key: ARTICLEREADY_TRUST_PROXY_HEADERS
        value: "1"
      - key: ARTICLEREADY_RATE_LIMIT_ENABLED
        value: "1"
      - key: ARTICLEREADY_HSTS_ENABLED
        value: "1"
      - key: ARTICLEREADY_ENABLE_API_DOCS
        value: "0"
      - key: ARTICLEREADY_SECURITY_CONTACT
        value: mailto:aadam@ucc.edu.gh
